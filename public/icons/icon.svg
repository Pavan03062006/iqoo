<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c1929"/>
      <stop offset="100%" stop-color="#050a10"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#003884" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect width="500" height="500" x="6" y="6" rx="94" fill="none" stroke="#00f0ff" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Tactical Grid Marks -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="6 8" stroke-opacity="0.3"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="256" y1="20" x2="256" y2="70" stroke="#00f0ff" stroke-width="3" stroke-opacity="0.6"/>
  <line x1="256" y1="442" x2="256" y2="492" stroke="#00f0ff" stroke-width="3" stroke-opacity="0.6"/>
  <line x1="20" y1="256" x2="70" y2="256" stroke="#00f0ff" stroke-width="3" stroke-opacity="0.6"/>
  <line x1="442" y1="256" x2="492" y2="256" stroke="#00f0ff" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Chamber Profile (Transparent Flask/Enclosure) -->
  <path d="M 170,120 L 342,120 L 342,160 L 372,210 L 372,390 C 372,410 356,426 336,426 L 176,426 C 156,426 140,410 140,390 L 140,210 L 170,160 Z"
        fill="#0a192f" fill-opacity="0.6" stroke="url(#neonCyan)" stroke-width="6" filter="url(#glow)"/>

  <!-- Water inside chamber -->
  <path d="M 144,280 Q 200,270 256,282 T 368,280 L 368,390 C 368,406 354,420 336,420 L 176,420 C 158,420 144,406 144,390 Z"
        fill="url(#waterGrad)"/>

  <!-- Rising Bubbles -->
  <circle cx="220" cy="340" r="8" fill="#00f0ff" opacity="0.6"/>
  <circle cx="290" cy="360" r="12" fill="#00f0ff" opacity="0.5"/>
  <circle cx="250" cy="310" r="6" fill="#00f0ff" opacity="0.7"/>

  <!-- Acoustic Sonar Pulse Waves -->
  <path d="M 226,170 C 236,158 276,158 286,170" fill="none" stroke="#00f0ff" stroke-width="4" stroke-linecap="round"/>
  <path d="M 210,185 C 230,168 282,168 302,185" fill="none" stroke="#00f0ff" stroke-width="4" stroke-linecap="round"/>
  <path d="M 194,200 C 224,178 288,178 318,200" fill="none" stroke="#00f0ff" stroke-width="4" stroke-linecap="round"/>

  <!-- Pressure Indicator Arrow -->
  <polygon points="256,76 270,104 242,104" fill="#ff9900" filter="url(#glow)"/>

  <!-- Central Rescue Cross Accent -->
  <rect x="246" y="246" width="20" height="20" rx="4" fill="#00f0ff" opacity="0.8"/>
</svg>
